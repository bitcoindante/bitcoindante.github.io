<!DOCTYPE html>
<html>
<head>
  <title>The Chronicle</title>
  <!-- 1. Import authentic Gothic and Medieval fonts from Google Fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- UnifrakturMaguntia for headers, Grenze Gotisch for medieval body text -->
  <link href="https://googleapis.com/css2?family=Grenze+Gotisch:wght@400;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #dfd3bd;
      background-image: 
        radial-gradient(rgba(0,0,0,0.04) 1px, transparent 0),
        radial-gradient(rgba(0,0,0,0.02) 1px, transparent 0);
      background-size: 4px 4px, 6px 6px;
      /* Grenze Gotisch gives the body paragraphs a clean medieval script look */
      font-family: 'Grenze Gotisch', serif;
      font-size: 1.35rem; /* Gothic fonts need to be slightly larger to read easily */
      color: #3d2f1d;
      margin: 0;
      padding: 50px 20px;
      display: flex;
      justify-content: center;
    }

    .torn-paper {
      background-color: #faf4e8;
      max-width: 600px;
      padding: 50px 40px;
      
      /* Jagged torn paper effect */
      clip-path: polygon(
        0% 2%, 4% 0%, 9% 3%, 15% 1%, 21% 4%, 27% 1%, 33% 3%, 40% 0%, 48% 2%, 55% 0%, 
        62% 3%, 68% 1%, 74% 4%, 81% 1%, 88% 3%, 94% 0%, 100% 2%,
        98% 8%, 100% 15%, 97% 23%, 99% 31%, 98% 40%, 100% 48%, 97% 56%, 99% 65%, 98% 74%, 100% 83%, 97% 91%, 99% 97%,
        95% 99%, 89% 97%, 83% 100%, 76% 98%, 70% 100%, 63% 97%, 56% 99%, 49% 97%, 42% 100%, 35% 98%, 28% 100%, 21% 97%, 14% 99%, 7% 97%, 0% 100%,
        2% 93%, 0% 84%, 3% 76%, 1% 67%, 2% 59%, 0% 50%, 3% 42%, 1% 33%, 2% 25%, 0% 16%, 2% 8%
      );

      box-shadow: inset 0 0 50px rgba(114, 82, 51, 0.4);
      line-height: 1.5;
    }

    h1 {
      /* UnifrakturMaguntia is a sharp, decorative Old English / Blackletter font */
      font-family: 'UnifrakturMaguntia', serif;
      font-size: 3.5rem;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 5px;
      color: #5c4033;
      text-align: center;
    }

    .date {
      font-family: 'Grenze Gotisch', serif;
      font-weight: bold;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      color: #8c7355;
      margin-bottom: 30px;
      border-bottom: 1px dashed #bdae93;
      padding-bottom: 15px;
    }

    /* Makes the very first letter of the text huge, like an old illuminated manuscript */
    .dropcap::first-letter {
      font-family: 'UnifrakturMaguntia', serif;
      font-size: 3.8rem;
      float: left;
      margin-right: 8px;
      margin-top: -5px;
      color: #8b0000; /* Dark blood red for the drop-cap */
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="torn-paper">
    <h1>Dante's Bitcoin Journey</h1>
    
    <!-- Added 'dropcap' class to make the first letter stand out -->
    <p class="dropcap"Midway upon the journey of our life, having dealt in various schemes from shitcoins to NFTs, I found myself in a dark forest, for the straightforward pathway had been lost
When before me a man appeared who seemed hoarse from long-continued silence 

“Are you man or am I imagining you?”

He answered me: “I once was a man. I was the receiver of Satoshi’s first transaction.” 

“And what do you want with me?”

“You have shitcoined. You have staked and tokenized; you have pumped and dumped. I have been sent here to show you the error of your ways, and to show you the righteous path.”

	And with that the earth split open, flames rose high and distant screams could be heard, and my guide beckoned me to follow him. We descended a path, leading us to a gate, upon which was inscribed
“Through me to everlasting pain you go. Through me you go and pass among lost souls. Abandon all cope, ye who enter here.”.</p>
    
    <p>This digital manuscript mimics the torn edges of a captain's log book using modern CSS shapes, coupled with sharp, authentic blackletter typography.</p>
  </div>

</body>
</html>
