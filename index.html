<!DOCTYPE html>
<html>
<head>
  <title>My Vintage Journal</title>
  <style>
    body {
      /* Sepia/parchment tone background */
      background-color: #f4ecd8; 
      /* Adds a subtle grainy paper texture using a CSS gradient */
      background-image: 
        radial-gradient(rgba(0,0,0,0.03) 1px, transparent 0),
        radial-gradient(rgba(0,0,0,0.02) 1px, transparent 0);
      background-size: 4px 4px, 6px 6px;
      
      /* Classic serif font that looks like a book or old typewriter */
      font-family: 'Georgia', Times, 'Times New Roman', serif;
      color: #3d2f1d; /* Faded dark brown instead of harsh black */
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .parchment {
      background-color: #faf4e8; /* Slightly lighter inner page */
      max-width: 650px;
      padding: 40px;
      /* Vignette effect to look like aged, burned edges */
      box-shadow: 
        inset 0 0 40px rgba(139, 115, 85, 0.15),
        0 10px 25px rgba(0, 0, 0, 0.08); 
      border: 1px solid #dfd3bd;
      border-radius: 4px;
      line-height: 1.6; /* Spaced out text for readability */
    }

    h1 {
      font-weight: normal;
      border-bottom: 1px dashed #bdae93; /* Subtle dividing line */
      padding-bottom: 10px;
      color: #5c4033; /* Darker brown for headers */
    }

    hr {
      border: 0;
      border-top: 1px dashed #bdae93;
      margin: 30px 0;
    }
  </style>
</head>
<body>

  <div class="parchment">
    <h1>September 14, 1892</h1>
    <p>This page uses CSS effects to mimic the warmth and texture of aged parchment paper. The dark brown text and serif typography complete the classic, historical feel.</p>
    <hr>
    <p>You can change this text to share your own stories, journal entries, or creative writing pieces.</p>
  </div>

</body>
</html>
